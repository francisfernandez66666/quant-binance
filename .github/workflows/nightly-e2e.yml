# nightly-e2e — §UAT-D7（2026-09-16）全栈端到端每日回归
# 此前 Playwright e2e（web/e2e）从未进 CI：50 条用例只靠本机手工起栈跑，
# 前端路由/接口契约/交易闭环的回归只能等人工想起来验证。本 job 复刻 UAT 实录栈：
# qmt-mock(18789) + quant(18080, 独立数据目录) + vite dev(5173, VITE_BACKEND_PORT=18080)，
# 初始化 admin/tester 账号、装配 QMT 配置、seed 情绪日线，再全量跑 spec。
# English: nightly full-stack e2e — builds mock+engine+frontend, seeds accounts/config/sentiment,
# then runs the Playwright suite that previously only existed as a manual drill.
#
# §N1（2026-09-26 全量审计批，docs/AUDIT_FULL_UAT_20260926.md）CI 单源化改造：
#   缺陷原文：本 job 曾内联复制「build 二进制→起 mock→起引擎→seed→起 vite→跑 playwright」
#     全套步骤，与 scripts/uat_bootstrap.sh 已实际分叉——① 裸 go build 无 buildCommit 注入，
#     nightly 栈的 A7 版本面恒测 unknown 指纹、与线上口径脱节；② 无 quote_source golden 注入
#     （§3.1-1 盘内形态在 nightly 里从不被触发）；③ seed 面（配额/持仓/auth.json admin id 读取）
#     一处改动两处不同步。
#   修法：整栈改为调用 ./scripts/uat_bootstrap.sh run（单一事实源，脚本头注 §FIX-5 写明
#     提取它的初衷就是 CI 与本地共用同一套口径）。本 job 只保留「工具链准备 → 显式装前端
#     依赖与 Playwright 内核 → 脚本驱动全栈 → 失败上传脚本落盘日志（.uat-data/*.log）→
#     if: always() 收尾 stop」。账号/token/端口/数据目录等 env 与脚本默认值逐一核对全同
#     （admin/tester、uat-secret、18080/5173/18789、$ROOT/.uat-data），冗余项全部删除，
#     仅保留静态锁要求的 E2E_MOCK_URL（值即脚本默认端口拼法）。
name: nightly-e2e

on:
  schedule:
    # 21:00 北京时间（UTC 13:00），周二~周六 = A股交易日夜检
    - cron: "0 13 * * 2-6"
  workflow_dispatch:

jobs:
  # 唯一 job：交由 scripts/uat_bootstrap.sh 拉起"qmt-mock 柜台 + quant 引擎 + vite 前端"
  # 三件套并跑 Playwright 全量 spec（§N1 单源化，口径详见文件头注释）。
  # 40 分钟超时兜底：Playwright 卡死/等待期重试风暴时不至于烧满 runner 计费时长。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # §N1：E2E_USER/E2E_PASS/E2E_USER2/E2E_PASS2/QMT_TOKEN/QUANT_DATA_DIR/BACKEND 与
    # uat_bootstrap.sh 内默认值逐一等值，原样保留只会造成"两处定义一处生效"的新漂移面，
    # 故全部删除、以脚本为单一事实源；run 模式下脚本自行向 playwright 导出全套 E2E_*。
    env:
      # §UAT-PORTS（抄母仓 cf3be1f）：显式声明 mock 地址 ⇒ spec 里的「连不上 mock 就 skip」在本 job
      # 升级为判红。CI 本来就要求"零 skip"（FIX-8 黄牌），让外部部署才需要的软跳过在这里失效。
      # 该键同时供人工步进 runner 手工跑 spec 时使用；自动化路径由脚本 run 模式导出（同值同口径）。
      E2E_MOCK_URL: http://127.0.0.1:18789
    steps:
      # 检出代码（Playwright spec 与后端二进制同仓构建；uat_bootstrap.sh 亦以检出目录为仓库根）
      - uses: actions/checkout@v4

      # Go 工具链按 go.mod 声明的版本安装，避免与本地开发环境漂移
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Node 20 + npm 缓存（按 web/package-lock.json 命中缓存提速）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Python 3.11 供 uat_bootstrap.sh 的 seed 段使用（golden 解析 + sqlite 直插情绪日线/报告，
      # auth.json 的 admin id 读取亦在脚本内完成）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install web deps + Playwright browser
        working-directory: web
        # §N1 保留显式安装：uat_bootstrap.sh 仅在 node_modules 缺失时才 npm ci（本地友好），
        # CI 上显式装更快也更清晰；Playwright chromium 内核及系统依赖脚本不负责装，必须在此装好，
        # 否则 run 模式的 `npx playwright test` 会当场判红。
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # §N1 核心步：全栈启动/seed/跑测一体化交给单一事实源脚本。
      # 脚本内部完成（口径与本地 UAT 逐字相同）：
      #   ① go build 注入 -X main.buildCommit（§F6，A7 版本面从此测真实指纹）；
      #   ② quote_source golden 注入 + 盘内快照落盘（§3.1-1）；
      #   ③ config.json rules.cn.enabled=true（§CN-MASTER）；
      #   ④ 起 mock(:18789)/引擎(:18080)、seed 账号+租户配额上调+QMT 装配+情绪日线+模拟盘持仓
      #      （含 auth.json 取 admin id、paper.json filled_at 隔日改写绕 T+1）；
      #   ⑤ 起 vite dev(:5173, --strictPort，runner 一次性环境无端口冲突残留)；
      #   ⑥ 导出 E2E_BASE_URL/E2E_API/E2E_MOCK_URL/E2E_QUOTE_SOURCE 等跑 Playwright 全量 spec。
      # run.log 落在工作区根而非 .uat-data/：脚本启动即 rm -rf 数据目录，tee 早开的句柄会
      # 写到被删除的 inode 上、产物上传取不到（真机口径差异点，故刻意放外面）。
      # §FIX-8 skip 黄牌保留：存在 skipped 用例即显式告警，不无声放过。
      - name: Run full-stack UAT (scripts/uat_bootstrap.sh run)
        run: |
          set +e
          ./scripts/uat_bootstrap.sh run 2>&1 | tee run.log
          status=${PIPESTATUS[0]}
          if grep -qE '[0-9]+ skipped' run.log; then
            echo "::warning title=FIX-8-skip-yellow-card::存在 skipped 用例——seed 覆盖可能退化，请核对（历史假绿源：卖出分支常年 skip）"
          fi
          exit $status

      # 仅失败时上传：Playwright 报告/trace + 脚本落盘的栈日志（.uat-data/{engine,engine2,mock,vite}.log，
      # §N1：日志路径随启动方式一并收敛到脚本数据目录，不再散在工作区根）+ run 全输出 + quote_source.txt。
      # 供夜间失败次日取证回放。
      - name: Upload report artifacts（失败时取证）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-report
          path: |
            web/playwright-report/
            web/test-results/
            run.log
            .uat-data/engine.log
            .uat-data/engine2.log
            .uat-data/mock.log
            .uat-data/vite.log
            .uat-data/quote_source.txt
          if-no-files-found: ignore

      # 收尾停栈（§N1）：uat_bootstrap.sh stop 按 pidfile + 本项目数据目录绝对路径精确兜底 kill
      # （§PICKILL-SCOPE/§VITE-ORPHAN），绝不伤及同机其它进程；always() 保证失败取证后也收口。
      # stop 自身无判红语义（无记录即静默成功），|| true 兜住极端场景。
      - name: Stop UAT stack
        if: always()
        run: ./scripts/uat_bootstrap.sh stop || true
