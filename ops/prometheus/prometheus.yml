# ── 文件头注释（§ENH-A3 Prometheus 抓取配置）──────────────────────────────
# 用途：双站（首尔 Linux/systemd + 广州 Win/NSSM，均 :8080）后端 /api/metrics/prometheus 指标抓取。
# 投放位置：Prometheus 主机 /etc/prometheus/prometheus.yml（Windows 版放 prometheus.yml 同目录）。
# 凭据：token 文件 /etc/prometheus/secrets/quant_token 单独投放，chmod 600，绝不写入本文件。
#   token=管理员账号经 POST /api/auth/login 签发的会话令牌（TTL 30 天，滑动续期仅登录时；
#   到期换发后 systemctl reload/prometheus 重启即可）。鉴权形态实证：authMiddleware 兼容
#   `Authorization: <token>` 与 `Bearer <token>` 双写法，故下方 authorization.type: Bearer 可用。
# 启动示例：prometheus --config.file=/etc/prometheus/prometheus.yml \
#             --storage.tsdb.path=/var/lib/prometheus --web.listen-address=127.0.0.1:9090
# 校验：promtool check config ops/prometheus/prometheus.yml
# ──────────────────────────────────────────────────────────────────────────
global:
  scrape_interval: 30s          # 与后端告警评估节奏一致
  evaluation_interval: 30s
  external_labels:
    monitor: quant-binance      # 站点维度用 target 标签 site（下方 static_configs 各打各的）

scrape_configs:
  - job_name: quant-binance
    metrics_path: /api/metrics/prometheus   # 手写 text exposition，promtool 兼容
    scheme: http
    authorization:
      type: Bearer                          # 服务端兼容带/不带前缀，Bearer 拼法可过
      credentials_file: /etc/prometheus/secrets/quant_token
    static_configs:
      # 占位符：<SEOUL_HOST>=首尔站 IP/域名，<GUANGZHOU_HOST>=广州站 IP/域名，投放时替换
      - targets: ["<SEOUL_HOST>:8080"]
        labels:
          site: seoul
      - targets: ["<GUANGZHOU_HOST>:8080"]
        labels:
          site: guangzhou
